<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Iván Mejía (Nuz777) - Full-stack developer. Simple, functional code. Rally and code.">
  <defs>
    <clipPath id="clip"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'SFMono-Regular', ui-monospace, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
    .d4 { animation-delay: .55s; } .d5 { animation-delay: .7s; } .d6 { animation-delay: .85s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .road { animation: road 1.1s linear infinite; }
    .needle { animation: rev 7s cubic-bezier(.45,0,.2,1) infinite; }
    .stripes { animation: drift 6s linear infinite; }
    .light { opacity: 0; animation: theme 16s ease-in-out infinite; }
    @keyframes theme {
      0%, 40.625% { opacity: 0; }
      46.875%, 90.625% { opacity: 1; }
      96.875%, 100% { opacity: 0; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 49% { fill-opacity: 1; } 50%, 100% { fill-opacity: 0; } }
    @keyframes road { to { stroke-dashoffset: -84; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-90px); } }
    @keyframes rev {
      0%   { transform: rotate(135deg); }
      8%   { transform: rotate(135deg); }
      30%  { transform: rotate(345deg); }
      38%  { transform: rotate(318deg); }
      55%  { transform: rotate(352deg); }
      70%  { transform: rotate(322deg); }
      100% { transform: rotate(135deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise, .cursor, .road, .needle, .stripes { animation: none; }
      .light { animation: none; opacity: 0; }
    }
  </style>

