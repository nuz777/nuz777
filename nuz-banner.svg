<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Iván Mejía / Nuz — Profile Banner</title>

  <defs>
    <clipPath id="clip-main">
      <rect width="900" height="280" rx="16"/>
    </clipPath>
    <style>
      .name { animation: fadeslide 0.8s ease forwards; opacity: 0; }
      .name1 { animation-delay: 0.1s; }
      .name2 { animation-delay: 0.3s; }
      .alias { animation: fadeslide 0.8s ease 0.5s forwards; opacity: 0; }
      .tagline { animation: fadeslide 0.8s ease 0.7s forwards; opacity: 0; }
      .bar { animation: barslide 1.2s ease 0.2s forwards; transform: scaleX(0); transform-origin: left; }
      .pill { animation: popin 0.4s ease forwards; opacity: 0; transform: scale(0.7); }
      .p1 { animation-delay: 0.6s; }
      .p2 { animation-delay: 0.75s; }
      .p3 { animation-delay: 0.9s; }
      .p4 { animation-delay: 1.05s; }
      .p5 { animation-delay: 1.2s; }
      .p6 { animation-delay: 1.35s; }
      .p7 { animation-delay: 1.5s; }
      .p8 { animation-delay: 1.65s; }
      .p9 { animation-delay: 1.8s; }
      .p10 { animation-delay: 1.95s; }
      .stripe { animation: stripeMove 6s linear infinite; }
      .dot-pulse { animation: dotpulse 2s ease-in-out infinite; }
      .dot-pulse2 { animation: dotpulse 2s ease-in-out 0.4s infinite; }
      .dot-pulse3 { animation: dotpulse 2s ease-in-out 0.8s infinite; }
      .bracket-tl { animation: bracketdraw 0.6s ease 0.2s forwards; opacity: 0; }
      .bracket-br { animation: bracketdraw 0.6s ease 0.4s forwards; opacity: 0; }
      .redbar { animation: barslide 1.4s cubic-bezier(0.22,1,0.36,1) 0.3s forwards; transform: scaleX(0); transform-origin: left; }

      @keyframes fadeslide {
        from { opacity: 0; transform: translateX(-18px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes barslide {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @keyframes popin {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes stripeMove {
        from { transform: translateX(0); }
        to   { transform: translateX(60px); }
      }
      @keyframes dotpulse {
        0%, 100% { opacity: 0.2; r: 2; }
        50% { opacity: 1; r: 3.5; }
      }
      @keyframes bracketdraw {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip-main)">

    <!-- Background -->
    <rect width="900" height="280" fill="#0e0e0e"/>

    <!-- Diagonal stripe panel right -->
    <polygon points="600,0 900,0 900,280 700,280" fill="#141414"/>

    <!-- Animated moving stripes -->
    <g class="stripe" opacity="0.07">
      <line x1="560" y1="0" x2="660" y2="280" stroke="#fff" stroke-width="18"/>
      <line x1="620" y1="0" x2="720" y2="280" stroke="#fff" stroke-width="10"/>
      <line x1="680" y1="0" x2="780" y2="280" stroke="#fff" stroke-width="18"/>
      <line x1="740" y1="0" x2="840" y2="280" stroke="#fff" stroke-width="10"/>
      <line x1="800" y1="0" x2="900" y2="280" stroke="#fff" stroke-width="18"/>
      <line x1="860" y1="0" x2="960" y2="280" stroke="#fff" stroke-width="10"/>
    </g>

    <!-- Static finer stripes -->
    <line x1="590" y1="0" x2="670" y2="280" stroke="#2a2a2a" stroke-width="0.5"/>
    <line x1="650" y1="0" x2="730" y2="280" stroke="#2a2a2a" stroke-width="0.5"/>

    <!-- Red accent bar bottom -->
    <rect x="50" y="242" width="380" height="2.5" rx="1" fill="#E24B4A" class="redbar"/>

    <!-- Bracket decorations -->
    <polyline class="bracket-tl" points="50,62 50,46 68,46" fill="none" stroke="#E24B4A" stroke-width="1.8" stroke-linecap="round"/>
    <polyline class="bracket-br" points="848,218 848,234 830,234" fill="none" stroke="#E24B4A" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Name -->
    <text class="name name1" x="50" y="128" font-family="'Courier New', monospace" font-size="68" font-weight="700" fill="#f0f0f0" letter-spacing="-2">Iván</text>
    <text class="name name2" x="50" y="200" font-family="'Courier New', monospace" font-size="68" font-weight="700" fill="#f0f0f0" letter-spacing="-2">Mejía</text>

    <!-- Alias -->
    <text class="alias" x="50" y="228" font-family="'Courier New', monospace" font-size="13" fill="#E24B4A" letter-spacing="4">/ NUZ</text>

    <!-- Tagline -->
    <text class="tagline" x="50" y="258" font-family="'Courier New', monospace" font-size="11" fill="#555" letter-spacing="2">CODE FAST. DRIVE FASTER.</text>

    <!-- Speed dots -->
    <circle cx="660" cy="252" r="2" fill="#2a2a2a" class="dot-pulse"/>
    <circle cx="674" cy="252" r="2" fill="#444"    class="dot-pulse2"/>
    <circle cx="688" cy="252" r="2" fill="#777"    class="dot-pulse3"/>
    <circle cx="702" cy="252" r="2" fill="#bbb"    class="dot-pulse"/>
    <circle cx="716" cy="252" r="2" fill="#E24B4A" class="dot-pulse2"/>

    <!-- Pills col 1 -->
    <g class="pill p1">
      <rect x="648" y="46" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="692" y="63" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#97C459">Python</text>
    </g>
    <g class="pill p2">
      <rect x="648" y="80" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="692" y="97" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FAC775">JavaScript</text>
    </g>
    <g class="pill p3">
      <rect x="648" y="114" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="692" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#AFA9EC">Vite</text>
    </g>
    <g class="pill p4">
      <rect x="648" y="148" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="692" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#5DCAA5">React</text>
    </g>
    <g class="pill p5">
      <rect x="648" y="182" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#E24B4A" stroke-width="0.8"/>
      <text x="692" y="199" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#E24B4A">Game Finder</text>
    </g>

    <!-- Pills col 2 -->
    <g class="pill p6">
      <rect x="746" y="46" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="790" y="63" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#F0997B">HTML</text>
    </g>
    <g class="pill p7">
      <rect x="746" y="80" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="790" y="97" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#AFA9EC">CSS</text>
    </g>
    <g class="pill p8">
      <rect x="746" y="114" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="790" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#85B7EB">MySQL</text>
    </g>
    <g class="pill p9">
      <rect x="746" y="148" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="790" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#85B7EB">SQL</text>
    </g>
    <g class="pill p10">
      <rect x="746" y="182" width="88" height="26" rx="5" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="0.5"/>
      <text x="790" y="199" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#F0997B">Linux</text>
    </g>

    <!-- Outer frame -->
    <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#222" stroke-width="1"/>

  </g>
</svg>
